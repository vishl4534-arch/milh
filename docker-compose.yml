services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: milh
      POSTGRES_PASSWORD: milh
      POSTGRES_DB: milh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milh"]
      interval: 5s
      retries: 10
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    expose: ["1883"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://milh:milh@db:5432/milh
      MQTT_URL: mqtt://mqtt:1883
    volumes: [media:/data/media]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  worker:
    build: ./backend
    command: ["python", "-m", "milh.worker"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://milh:milh@db:5432/milh
      MQTT_URL: mqtt://mqtt:1883
    volumes: [media:/data/media]
    depends_on:
      db: { condition: service_healthy }
  mqtt-bridge:
    build: ./backend
    command: ["python", "-m", "milh.ingestion.mqtt_bridge"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://milh:milh@db:5432/milh
      MQTT_URL: mqtt://mqtt:1883
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }
  web:
    profiles: ["dev"]
    image: node:20
    working_dir: /web
    command: ["sh", "-c", "npm ci && npm run dev -- --host"]
    volumes: [./web:/web]
    ports: ["5173:5173"]
volumes:
  pgdata:
  media:
